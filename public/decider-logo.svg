<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Decider">
  <rect width="48" height="48" rx="12" fill="#0a0a0a"/>
  <rect width="48" height="48" rx="12" fill="url(#decider-glow)"/>
  <!-- Two branches (A / B) merging into a single decision node -->
  <g stroke="#2BA3F7" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M14 15 H21 Q25 15 25 20 V24" opacity="0.55"/>
    <path d="M14 33 H21 Q25 33 25 28 V24" opacity="0.55"/>
    <path d="M25 24 H34" />
  </g>
  <!-- Option nodes -->
  <circle cx="13" cy="15" r="3.4" fill="#5BB8F9"/>
  <circle cx="13" cy="33" r="3.4" fill="#2BA3F7" fill-opacity="0.5"/>
  <!-- Chosen node -->
  <circle cx="35" cy="24" r="4.6" fill="#2BA3F7"/>
  <circle cx="35" cy="24" r="4.6" stroke="#5BB8F9" stroke-width="1.4" fill="none"/>
  <defs>
    <linearGradient id="decider-glow" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2BA3F7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2BA3F7" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
